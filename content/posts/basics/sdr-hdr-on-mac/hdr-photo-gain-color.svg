<svg xmlns="http://www.w3.org/2000/svg" width="750" height="375" viewBox="0 0 750 375" role="img" aria-labelledby="t d"><title id="t">增益图的绿块 R/G 两轮实测和单变量重建对照</title><desc id="d">上一轮 Safari 0.322，本轮 0.162，独立重建探针只去除色彩空间附件后由 0.167 升至 0.324。</desc><rect width="750" height="375" fill="#f8fafc" rx="18"/><g font-family="system-ui, sans-serif" fill="#1c2c40"><text x="24" y="35" font-size="21" font-weight="700">增益图 JPEG｜绿色高光的 R/G</text><text x="24" y="59" font-size="14" fill="#506570">次通道占比越大，绿块越接近中性；不是全局感知饱和度指标。</text><path d="M240.0 78 V319" stroke="#cdd9e3" stroke-dasharray="4 3"/><text x="240.0" y="340" text-anchor="middle" font-size="13">0.0</text><path d="M362.2 78 V319" stroke="#cdd9e3" stroke-dasharray="4 3"/><text x="362.2" y="340" text-anchor="middle" font-size="13">0.1</text><path d="M484.4 78 V319" stroke="#cdd9e3" stroke-dasharray="4 3"/><text x="484.4" y="340" text-anchor="middle" font-size="13">0.2</text><path d="M606.7 78 V319" stroke="#cdd9e3" stroke-dasharray="4 3"/><text x="606.7" y="340" text-anchor="middle" font-size="13">0.3</text><text x="24" y="99" font-size="15">上轮前台 · 预览</text><rect x="240" y="81" width="215.1" height="24" rx="5" fill="#5887a3"/><text x="464.1" y="99" font-size="15" font-weight="650">0.176</text><text x="24" y="139" font-size="15">上轮前台 · Safari</text><rect x="240" y="121" width="393.6" height="24" rx="5" fill="#cc7338"/><text x="642.6" y="139" font-size="15" font-weight="650">0.322</text><text x="24" y="179" font-size="15">本轮前台 · 预览</text><rect x="240" y="161" width="202.9" height="24" rx="5" fill="#5887a3"/><text x="451.9" y="179" font-size="15" font-weight="650">0.166</text><text x="24" y="219" font-size="15">本轮前台 · Safari</text><rect x="240" y="201" width="198.0" height="24" rx="5" fill="#cc7338"/><text x="447.0" y="219" font-size="15" font-weight="650">0.162</text><text x="24" y="259" font-size="15">独立探针 · 正确 P3</text><rect x="240" y="241" width="204.1" height="24" rx="5" fill="#207e68"/><text x="453.1" y="259" font-size="15" font-weight="650">0.167</text><text x="24" y="299" font-size="15">独立探针 · 缺附件</text><rect x="240" y="281" width="396.0" height="24" rx="5" fill="#9673bd"/><text x="645.0" y="299" font-size="15" font-weight="650">0.324</text><text x="24" y="361" font-size="12" fill="#506570">前台两轮的取样方法不同。探针只改底图的色彩空间附件，未测物理亮度。</text></g></svg>