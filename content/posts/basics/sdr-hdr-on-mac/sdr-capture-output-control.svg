<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 309" role="img" aria-labelledby="title"><title id="title">同一个 SDR 视频，采用不同截图输出会造成虚假的应用差异</title><rect width="810" height="309" rx="15" fill="#f8fafc"/><g font-family="system-ui, sans-serif" font-size="15" fill="#0f172a"><text x="28" y="31" font-size="20" font-weight="650">先统一截图输出，再比较应用</text><text x="28" y="55" font-size="13" fill="#475569">同一 BT.709 视频，源中灰 Y′126 · 线性亮度 Y，白约 1.0（不是 nit）</text><text x="28" y="98" fill="#215ac0">Chrome · SDR PNG</text><rect x="291" y="81" width="406.6" height="21" rx="5" fill="#215ac0"/><text x="707.6" y="97" font-family="ui-monospace,monospace">0.2595</text><text x="28" y="145" fill="#238173">Safari · SDR PNG</text><rect x="291" y="128" width="406.5" height="21" rx="5" fill="#238173"/><text x="707.5" y="144" font-family="ui-monospace,monospace">0.2595</text><text x="28" y="192" fill="#7b51a8">Chrome · HDR stream preset</text><rect x="291" y="175" width="406.2" height="21" rx="5" fill="#7b51a8"/><text x="707.2" y="191" font-family="ui-monospace,monospace">0.2593</text><text x="28" y="239" fill="#c44c40">Safari · HDR local screenshot</text><rect x="291" y="222" width="300.2" height="21" rx="5" fill="#c44c40"/><text x="601.2" y="238" font-family="ui-monospace,monospace">0.1916</text><text x="28" y="285" fill="#475569" font-size="13">下方是两种不同的 HDR 捕获输出，不用于应用之间的 SDR 主对照。</text></g></svg>
