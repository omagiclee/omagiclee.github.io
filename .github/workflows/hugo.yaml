# Hugo 站点构建检查和部署到 GitHub Pages
name: Build and deploy Hugo site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Hugo build
    runs-on: ubuntu-26.04
    env:
      HUGO_VERSION: 0.169.0
      DART_SASS_VERSION: 1.107.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          
      - name: Install Dart Sass
        run: |
          curl --fail --location --retry 3 --output "${{ runner.temp }}/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "6cefe78692d03ca53843394bb98de4dccf9a3d8ee5ece40be7316be852624003  ${{ runner.temp }}/dart-sass.tar.gz" | sha256sum --check
          tar -xzf "${{ runner.temp }}/dart-sass.tar.gz" -C "${{ runner.temp }}"
          echo "${{ runner.temp }}/dart-sass" >> "$GITHUB_PATH"
          "${{ runner.temp }}/dart-sass/sass" --version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build and check site while preparing Chrome
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          browser_log="$RUNNER_TEMP/chromium-setup.log"
          site_log="$RUNNER_TEMP/hugo-build.log"

          bash scripts/prepare-ci-chromium.sh > "$browser_log" 2>&1 &
          browser_pid=$!
          (
            SECONDS=0
            hugo --gc --minify --cleanDestinationDir
            python3 scripts/check-site.py public
            python3 scripts/check-local-photos-publication.py public
            echo "Hugo build and static checks took ${SECONDS}s"
          ) > "$site_log" 2>&1 &
          site_pid=$!

          site_status=0
          browser_status=0
          wait "$site_pid" || site_status=$?
          wait "$browser_pid" || browser_status=$?

          echo '::group::Hugo build and static checks'
          cat "$site_log"
          echo '::endgroup::'
          echo '::group::Chrome preparation'
          cat "$browser_log"
          echo '::endgroup::'

          if (( site_status != 0 || browser_status != 0 )); then
            echo "::error::Hugo build or static checks exited $site_status. Chrome preparation exited $browser_status."
            exit 1
          fi

      - name: Run browser smoke tests
        run: npm run test:site -- public

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
