{{- if .Pages -}}
<section class="posts-section">
    <h2 class="posts-section-title">{{ .Title }}</h2>
    <div class="posts-list">
        {{- range first .Limit .Pages -}}
        <a href="{{ .RelPermalink }}" class="post-row">
            <span class="post-row-title">{{ .Title | emojify }}</span>
            <time class="post-row-date" datetime="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}" title="Updated on {{ .Lastmod.Format "Jan 2, 2006" }}; published on {{ .PublishDate.Format "Jan 2, 2006" }}">{{ .Lastmod.Format "2006-01-02" }}</time>
        </a>
        {{- end -}}
    </div>
    {{- if and .URL (gt (len .Pages) .Limit) -}}
    <div class="section-footer"><a href="{{ .URL | relURL }}">{{ .LinkLabel | default "Read more" }} &rarr;</a></div>
    {{- end -}}
</section>
{{- end -}}
