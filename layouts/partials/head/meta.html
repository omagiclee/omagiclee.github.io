{{- $description := partial "function/description.html" . -}}

<meta name="description" content="{{ $description }}">

<meta property="og:title" content="{{ .Title | default .Site.Title }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:site_name" content="{{ .Site.Title }}">
<meta property="og:locale" content="{{ partial "function/content-language.html" . | replaceRE "-" "_" }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ .Title | default .Site.Title }}">
<meta name="twitter:description" content="{{ $description }}">
{{- with .Params.images -}}
    {{- range first 1 . -}}
        <meta property="og:image" content="{{ . | absURL }}">
        <meta name="twitter:image" content="{{ . | absURL }}">
    {{- end -}}
{{- end -}}
{{- if .IsPage -}}
    <meta property="article:published_time" content="{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">
    <meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
{{- end -}}

<meta name="application-name" content="{{ .Site.Params.app.title | default .Site.Title }}">
<meta name="apple-mobile-web-app-title" content="{{ .Site.Params.app.title | default .Site.Title }}">

{{- with .Site.Params.app.themeColor -}}
    <meta name="theme-color" content="{{ . }}">
{{- end -}}
{{- with .Site.Params.app.tileColor -}}
    <meta name="msapplication-TileColor" content="{{ . }}">
{{- end -}}
